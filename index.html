<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Codenames Online</title>
    <link rel="stylesheet" href="style.css?v=4.0.7">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <div class="container">
        <header class="simple-header">
            <h1><i class="fas fa-user-secret"></i> Codenames</h1>
            <div class="room-tag">
                <code id="roomDisplay">...</code>
                <span id="connectionStatus" class="status-dot"></span>
            </div>
        </header>

        <div id="gameArea" style="display: none;">
            <div class="scoreboard">
                <div class="team-score red">
                    <span class="team-label"><i class="fas fa-fire"></i> Красные</span>
                    <span class="team-count" id="redCount">9</span>
                </div>
                <div class="turn-indicator" id="currentTurn">
                    <span class="turn-label">Ход</span>
                    <span class="turn-team red">Красные</span>
                </div>
                <div class="team-score blue">
                    <span class="team-label"><i class="fas fa-water"></i> Синие</span>
                    <span class="team-count" id="blueCount">8</span>
                </div>
            </div>

            <div class="game-board-container">
                <div class="board" id="gameBoard"></div>
                <div class="hold-hint" id="holdHint"><i class="fas fa-hand-point-up"></i> Удерживайте 2с</div>
            </div>
        </div>

        <button class="fab fullscreen-btn" id="btnFullscreen" title="Во весь экран">
            <i class="fas fa-expand"></i>
        </button>
        <div class="fab burger-btn" id="burgerBtn">
            <i class="fas fa-bars"></i>
        </div>

        <div class="menu-overlay" id="menuOverlay"></div>
        <div class="menu-content" id="menuContent">
            <!-- содержимое меню -->
        </div>

        <div id="notification" class="notification"></div>
    </div>

    <script src="js/config.js?v=4.0.7"></script>
    <script src="js/utils.js?v=4.0.7"></script>
    <script src="js/websocket.js?v=4.0.7"></script>
    <script src="js/game.js?v=4.0.7"></script>
    <script src="js/ui.js?v=4.0.7"></script>
    <script src="js/mobile.js?v=4.0.7"></script>
    <script src="js/events.js?v=4.0.7"></script>
    <script src="js/main.js?v=4.0.7"></script>
</body>
</html>
