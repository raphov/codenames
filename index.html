<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Codenames Online</title>
    <link rel="stylesheet" href="style.css?v=4.1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <div class="container">
        <header class="simple-header">
            <h1><i class="fas fa-user-secret"></i> Codenames</h1>
            <div class="room-tag">
                <code id="roomDisplay">...</code>
                <span id="connectionStatus" class="status-dot"></span>
            </div>
        </header>

        <div id="gameArea" style="display: none;">
            <div class="scoreboard">
                <div class="team-score red">
                    <span class="team-label"><i class="fas fa-fire"></i> Красные</span>
                    <span class="team-count" id="redCount">9</span>
                </div>
                <div class="turn-indicator" id="currentTurn">
                    <span class="turn-label">Ход</span>
                    <span class="turn-team red">Красные</span>
                </div>
                <div class="team-score blue">
                    <span class="team-label"><i class="fas fa-water"></i> Синие</span>
                    <span class="team-count" id="blueCount">8</span>
                </div>
            </div>

            <div class="game-board-container">
                <div class="board" id="gameBoard"></div>
                <div class="hold-hint" id="holdHint"><i class="fas fa-hand-point-up"></i> Удерживайте 2с</div>
            </div>
        </div>

        <button class="fab fullscreen-btn" id="btnFullscreen" title="Во весь экран">
            <i class="fas fa-expand"></i>
        </button>
        <div class="fab burger-btn" id="burgerBtn">
            <i class="fas fa-bars"></i>
        </div>

        <div class="menu-overlay" id="menuOverlay"></div>
        <div class="menu-content" id="menuContent">
            <div class="menu-header">
                <h3><i class="fas fa-cog"></i> Настройки</h3>
                <button class="menu-close" id="closeMenu">&times;</button>
            </div>
            <div class="menu-section">
                <h4><i class="fas fa-palette"></i> Тема</h4>
                <button class="menu-btn" id="themeToggle">
                    <i class="fas fa-moon"></i> Тёмная
                </button>
            </div>
            <div class="menu-section">
                <h4><i class="fas fa-gamepad"></i> Управление</h4>
                <button class="menu-btn" id="showRules"><i class="fas fa-book"></i> Правила</button>
                <button class="menu-btn" id="showHotkeys"><i class="fas fa-keyboard"></i> Горячие клавиши</button>
            </div>
            <div class="menu-section">
                <h4><i class="fas fa-chart-line"></i> Статистика</h4>
                <div class="game-stats">
                    <div class="stat"><span class="stat-label">Открыто</span><span class="stat-value" id="openedCards">0</span></div>
                    <div class="stat"><span class="stat-label">Ход</span><span class="stat-value" id="currentMove">1</span></div>
                </div>
            </div>
            <div class="menu-footer">
                <a href="https://t.me/codenames_raphov_bot" target="_blank" class="bot-link">
                    <i class="fab fa-telegram"></i> Бот
                </a>
            </div>
        </div>

        <div id="notification" class="notification"></div>
    </div>

    <script src="js/config.js?v=4.1.0"></script>
    <script src="js/utils.js?v=4.1.0"></script>
    <script src="js/websocket.js?v=4.1.0"></script>
    <script src="js/game.js?v=4.1.0"></script>
    <script src="js/ui.js?v=4.1.0"></script>
    <script src="js/mobile.js?v=4.1.0"></script>
    <script src="js/events.js?v=4.1.0"></script>
    <script src="js/main.js?v=4.1.0"></script>
</body>
</html>
